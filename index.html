const GS_VER='2026-11-17b',GS="// KOLEKTA backend. Paste into Extensions > Apps Script of a Google Sheet.\n// Project Settings > Script properties: add ADMIN_PASS (full access) and TREASURER_PASS (the password the treasurer team shares).\n// Deploy > New deployment > Web app > Execute as: Me, Access: Anyone. Copy the /exec URL.\n// Payments are saved fast; balance sheets, collection tabs and receipt emails are finished by a background trigger (created automatically, or by setup()).\n// After updating this file: Deploy > Manage deployments > Edit > Version: New version > Deploy.\n// Then run setup() once from the editor and approve the permissions (Drive stores receipt photos; the receipt logo is fetched from your hosted app, so \"connect to an external service\" is also asked).\nconst H = {\n  Students: ['id','name','section','qr','created','email'],\n  Collections: ['id','name','description','amount','start','deadline','section','status','frequency'],\n  Transactions: ['txid','clientId','studentId','name','section','collId','collection','amount','date','time','by','status','payStatus','note','method','ref','proof','receipt'],\n  Expenses: ['id','clientId','date','time','title','category','amount','by','status','proof','note'],\n  Settings: ['key','value'],\n  'Student Balances': ['id','name','section','expected','paid','balance','status','updated'],\n  Reports: ['note'],\n  Portal: ['id','hash','must'],\n  Submissions: ['sid','studentId','name','collId','collection','amount','method','accName','acct','ref','proof','status','reason','date','time','txid'],\n  'Admin Logs': ['time','user','action','detail']\n};\n// The shared treasurer login can record payments and expenses, but only the admin can do these:\nconst ADMIN_ONLY = ['delete','void','voidexp','setcfg','edittx','editexp','logs','newyear','remcfg','remind','collsheets','saveqr','subs','subset','pinreset'];\nconst VER = '2026-11-17b';\nconst NOLOCK = ['all', 'img', 'logs'];   // read-only actions never wait for the lock\nlet CUR = 'system';   // who is making the current request, written to Admin Logs\nlet _db = null;\nfunction db() { return _db || (_db = db0()); }\nfunction db0() {\n  // Works whether the script is attached to a Sheet or standalone.\n  let s = SpreadsheetApp.getActive();\n  if (s) return s;\n  const P = PropertiesService.getScriptProperties(), id = P.getProperty('SHEET_ID');\n  if (id) return SpreadsheetApp.openById(id);\n  s = SpreadsheetApp.create('KOLEKTA Database');\n  P.setProperty('SHEET_ID', s.getId());\n  return s;\n}\nconst _sh = {};\nfunction sh(n) { return _sh[n] || (_sh[n] = sh0(n)); }\nfunction sh0(n) {\n  const ss = db();\n  let s = ss.getSheetByName(n);\n  if (!s) {\n    s = ss.insertSheet(n);\n    s.appendRow(H[n]); s.setFrozenRows(1);\n    s.getRange(1, 1, 1, H[n].length).setFontWeight('bold');\n    s.getRange(1, 1, s.getMaxRows(), H[n].length).setNumberFormat('@');\n  } else if (s.getLastColumn() < H[n].length) {   // add newly introduced columns to an older sheet\n    const old = s.getLastColumn();\n    s.getRange(1, old + 1, s.getMaxRows(), H[n].length - old).setNumberFormat('@');\n    s.getRange(1, 1, 1, H[n].length).setValues([H[n]]).setFontWeight('bold');\n  }\n  return s;\n}\nfunction rows(n) {\n  const v = sh(n).getDataRange().getDisplayValues(), h = v.shift();\n  return v.filter(r => r[0] !== '').map(r => Object.fromEntries(h.map((k, i) => [k, r[i]])));\n}\nfunction log(a, d) { sh('Admin Logs').appendRow([new Date().toISOString(), CUR, a, String(d)]); }\nfunction put(n, row) {\n  const s = sh(n), h = H[n], v = s.getDataRange().getValues();\n  const i = v.findIndex((r, k) => k && String(r[0]) === String(row[h[0]]));\n  const a = h.map(k => row[k] == null ? '' : row[k]);\n  if (i > 0) s.getRange(i + 1, 1, 1, h.length).setValues([a]); else s.appendRow(a);\n}\n// Receipt and payment photos live in a private Drive folder. The app fetches them through the API, so nobody needs Drive access.\nfunction folder() {\n  const P = PropertiesService.getScriptProperties(), id = P.getProperty('FOLDER_ID');\n  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }\n  const f = DriveApp.createFolder('KOLEKTA Proofs');\n  P.setProperty('FOLDER_ID', f.getId());\n  return f;\n}\nfunction saveImg(d, name) {\n  const m = /^data:(image\\/[a-z+]+);base64,(.+)$/.exec(d);\n  if (!m) throw 'bad image';\n  return folder().createFile(Utilities.newBlob(Utilities.base64Decode(m[2]), m[1], name + '.jpg')).getId();\n}\nfunction testEmail() { MailApp.sendEmail(Session.getActiveUser().getEmail(), 'Test receipt', 'If you can read this, email sending works.'); }\nfunction setup() { Object.keys(H).forEach(n => sh(n)); folder(); ensureTick_(true); sig_('init'); Logger.log(db().getUrl()); }  // run once from the editor to authorize\nfunction doGet() { return ContentService.createTextOutput('KOLEKTA API is running'); }\nfunction doPost(e) {\n  const q = JSON.parse(e.postData.contents), P = PropertiesService.getScriptProperties(), C = CacheService.getScriptCache();\n  let r;\n  try {\n    if (String(q.action).indexOf('p_') === 0) { r = portal_(q, C); } else if (q.action === 'verify') {\n      r = verify_(q, C);   // public: whoever holds the receipt QR can check it; nothing else is exposed\n    } else if (q.action === 'login') {\n      const A = P.getProperty('ADMIN_PASS'), T = P.getProperty('TREASURER_PASS');\n      Utilities.sleep(800);\n      const role = A && q.pass === A ? 'admin' : T && q.pass === T ? 'treasurer' : '';\n      if (!role) throw 'Wrong password';\n      const nm = String(q.name || '').trim().slice(0, 40) || role, t = Utilities.getUuid() + Utilities.getUuid();\n      P.setProperty('t_' + t, JSON.stringify({ r: role, n: nm, c: Date.now() }));   // no 6-hour limit: stays signed in until Sign out (cache would cap at 6h)\n      pruneSessions_(P);\n      CUR = nm + ' (' + role + ')'; log('login', '');\n      r = { token: t, role: role, name: nm };\n    } else {\n      const raw = q.token && (P.getProperty('t_' + q.token) || C.get('t_' + q.token));\n      if (!raw) throw 'auth';\n      let ses; try { ses = JSON.parse(raw); } catch (x) { ses = null; }\n      if (!ses || !ses.r) ses = { r: 'admin', n: 'admin' };   // sessions created before roles existed\n      if (ADMIN_ONLY.includes(q.action) && ses.r !== 'admin') throw 'Only the admin can do that';\n      CUR = ses.n + ' (' + ses.r + ')';\n      if (q.action === 'tx' || q.action === 'exp') prepProof_(q);   // photo upload happens before the lock, so other payments are not kept waiting\n      if (NOLOCK.indexOf(q.action) >= 0) r = run(q, ses);\n      else { const L = LockService.getScriptLock(); L.waitLock(25000); try { r = run(q, ses); } finally { L.releaseLock(); } }\n    }\n  } catch (x) { r = { error: String(x) }; }\n  return ContentService.createTextOutput(JSON.stringify(r)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction pruneSessions_(P) {   // drop sessions unused for a long time (180 days) so storage never fills up\n  const all = P.getProperties(), old = Date.now() - 15552000000;\n  Object.keys(all).forEach(k => { if (k.indexOf('t_') !== 0) return; try { if (JSON.parse(all[k]).c < old) P.deleteProperty(k); } catch (e) {} });\n}\nfunction run(q, ses) {\n  const a = q.action;\n  if (a === 'subs') return { subs: rows('Submissions') };\n  if (a === 'subset') {\n    const r = rows('Submissions').find(x => x.sid === q.sid);\n    if (!r || r.status !== 'PENDING') throw 'Already handled';\n    r.status = q.status === 'APPROVED' ? 'APPROVED' : 'REJECTED'; r.reason = String(q.reason || '').slice(0, 120); r.txid = q.txid || '';\n    put('Submissions', r); log('portal ' + r.status, q.sid);\n    if (r.status === 'REJECTED') { try {\n      const s = rows('Students').find(x => String(x.id) === String(r.studentId));\n      if (s && /^\\S+@\\S+\\.\\S+$/.test(s.email || '') && MailApp.getRemainingDailyQuota() > 0) MailApp.sendEmail({ to: s.email, name: 'KOLEKTA', subject: 'Your payment was not accepted',\n        body: 'Hi ' + s.name + ', your payment of PHP ' + r.amount + ' for ' + r.collection + ' (ref ' + r.ref + ') was not accepted. Reason: ' + (r.reason || 'not stated') + '. Please open the student portal and submit again. If you think this is a mistake, message your treasurer.' });\n    } catch (e) {} }\n    return { ok: 1 };\n  }\n  if (a === 'pinreset') { put('Portal', { id: q.id, hash: '', must: '1' }); log('pin reset', q.id); return { ok: 1 }; }\n\n  if (a === 'all') {\n    const P = PropertiesService.getScriptProperties();\n    if (P.getProperty('JOBS') && Date.now() - Number(P.getProperty('JOBS_T') || 0) > 300000) P.deleteProperty('TICK');   // queued work is stuck: the next payment re-creates the trigger\n    return {\n      ver: VER, students: rows('Students'), collections: rows('Collections'), transactions: rows('Transactions'),\n      expenses: rows('Expenses'), cfg: Object.fromEntries(rows('Settings').map(x => [x.key, x.value]))\n    };\n  }\n  if (a === 'upsert') {\n    if (!['Students', 'Collections'].includes(q.sheet)) throw 'bad sheet';\n    put(q.sheet, q.row); log('save ' + q.sheet, q.row.id);\n    defer_(q.sheet === 'Collections' ? { bal: 1, coll: q.row.id } : { bal: 1, all: 1 });\n    return { ok: 1 };\n  }\n  if (a === 'delete') {\n    const sn = q.sheet === 'Collections' ? 'Collections' : 'Students';\n    const s = sh(sn), v = s.getDataRange().getValues();\n    const i = v.findIndex((r, k) => k && String(r[0]) === q.id);\n    if (i > 0) s.deleteRow(i + 1);\n    log('delete ' + sn, q.id); defer_({ bal: 1, all: 1 }); return { ok: 1 };\n  }\n  if (a === 'tx') {   // append-only and duplicate-safe via clientId. Only the row is written here; the rest is queued.\n    const t = q.row, P = PropertiesService.getScriptProperties();\n    if (q.appUrl && /^https:\\/\\/[^\\s\"'<>]{4,180}$/.test(q.appUrl) && P.getProperty('APP_URL') !== q.appUrl && (ses.r === 'admin' || !P.getProperty('APP_URL'))) P.setProperty('APP_URL', q.appUrl);\n    if (hasClient_('Transactions', t.clientId)) {   // a retry of something already saved\n      const o = rows('Transactions').find(x => x.clientId === t.clientId) || {};\n      return { ok: 1, dup: 1, receipt: o.receipt || '', code: o.receipt ? code_(o) : '' };\n    }\n    t.by = ses.n; t.status = t.status || 'VALID'; delete t.proofData;\n    const no = nextNo_(P);\n    t.receipt = 'KOL-' + String(no).padStart(4, '0');   // KOL-0001, KOL-0002 ... assigned by the server\n    if (t.ref) { const d = refDup_(t.ref); if (d) { t.note = (t.note ? t.note + '; ' : '') + 'Duplicate ref of ' + d; log('duplicate ref', t.txid + ' ' + t.ref + ' same as ' + d); } }\n    sh('Transactions').appendRow(H.Transactions.map(k => t[k] == null ? '' : t[k]));\n    P.setProperty('RCPT_SEQ', String(no));\n    CacheService.getScriptCache().put('c_' + t.clientId, '1', 21600);\n    log('payment', t.txid + ' ' + t.studentId + ' ' + t.amount + ' ' + (t.method || 'Cash') + (t.ref ? ' ref ' + t.ref : ''));\n    defer_({ bal: 1, coll: t.collId, mail: t.emailReceipt ? t.txid : '' });\n    return { ok: 1, receipt: t.receipt, code: code_(t) };\n  }\n  if (a === 'void') {  // never deletes; marks VOID and logs\n    const s = sh('Transactions'), v = s.getDataRange().getValues(), ci = H.Transactions.indexOf('status');\n    const i = v.findIndex((r, k) => k && r[0] === q.txid);\n    if (i < 1) throw 'Transaction not found';\n    s.getRange(i + 1, ci + 1).setValue('VOID');\n    s.getRange(i + 1, ci + 3).setValue('Voided: ' + q.reason);\n    log('void', q.txid + ' ' + q.reason); defer_({ bal: 1, coll: v[i][H.Transactions.indexOf('collId')] });\n    return { ok: 1 };\n  }\n  if (a === 'exp') {   // expenses: append-only, duplicate-safe via clientId\n    const e = q.row;\n    if (!hasClient_('Expenses', e.clientId)) {\n      e.by = ses.n; e.status = 'VALID'; delete e.proofData;\n      sh('Expenses').appendRow(H.Expenses.map(k => e[k] == null ? '' : e[k]));\n      CacheService.getScriptCache().put('c_' + e.clientId, '1', 21600);\n      log('expense', e.id + ' ' + e.title + ' ' + e.amount);\n    }\n    return { ok: 1 };\n  }\n  if (a === 'voidexp') {\n    const s = sh('Expenses'), v = s.getDataRange().getValues();\n    const i = v.findIndex((r, k) => k && r[0] === q.id);\n    if (i < 1) throw 'Expense not found';\n    s.getRange(i + 1, H.Expenses.indexOf('status') + 1).setValue('VOID');\n    s.getRange(i + 1, H.Expenses.indexOf('note') + 1).setValue('Voided: ' + q.reason);\n    log('void expense', q.id + ' ' + q.reason); return { ok: 1 };\n  }\n  if (a === 'img') {   // only files inside the KOLEKTA Proofs folder can be read\n    const f = DriveApp.getFileById(q.id), p = f.getParents();\n    if (!p.hasNext() || p.next().getId() !== folder().getId()) throw 'not allowed';\n    const b = f.getBlob();\n    return { data: 'data:' + b.getContentType() + ';base64,' + Utilities.base64Encode(b.getBytes()) };\n  }\n  if (a === 'saveqr') {   // admin uploads the GCash or bank QR image; only its Drive id is stored in Settings\n    const k = q.kind === 'bank' ? 'bank_qr' : 'gcash_qr';\n    const id = saveImg(q.data, 'qr-' + k + '-' + Date.now());\n    put('Settings', { key: k, value: id });\n    log('payment qr', k + ' ' + id); return { ok: 1, id: id };\n  }\n  if (a === 'setcfg') {   // GCash / bank details shown to the treasurers\n    const c = q.cfg || {};\n    const ks = ['gcash_name', 'gcash_no', 'bank', 'goal_name', 'goal_amount', 'goal_on', 'gcash_qr', 'bank_qr', 'opening_amount', 'opening_method', 'opening_date', 'opening_note', 'portal_note', 'portal_fund'].filter(k => c[k] !== undefined);\n    putMany('Settings', ks.map(k => ({ key: k, value: String(c[k] || '').slice(0, 200) })));\n    log('settings', Object.keys(c).filter(k => k.indexOf('_qr') < 0).map(k => k + '=' + String(c[k]).slice(0, 40)).join(', ')); return { ok: 1 };\n  }\n  if (a === 'remcfg') {   // weekly email reminders: on or off, on a chosen day and hour\n    const on = !!q.on, WD = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SA n    const copy = DriveApp.getFileById(db().getId()).makeCopy('KOLEKTA archive ' + Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HHmm'));\n    ['Transactions', 'Expenses'].concat(q.collections ? ['Collections'] : [], q.students ? ['Students'] : []).forEach(n => {\n      const s = sh(n), last = s.getLastRow();\n      if (last > 1) s.getRange(2, 1, last - 1, H[n].length).clearContent();\n    });\n    PropertiesService.getScriptProperties().deleteProperty('RCPT_SEQ');   // receipt numbers start again from KOL-0001\n    log('new school year', 'archive ' + copy.getUrl() + (q.collections ? ' +collections' : '') + (q.students ? ' +students' : ''));\n    defer_({ bal: 1, all: 1 });\n    return { ok: 1, url: copy.getUrl() };\n  }\n  throw 'bad action';\n}\nfunction bal(S0, C0, T0) {\n  const S = S0 || rows('Students'), C = (C0 || rows('Collections')).filter(c => c.status !== 'CLOSED'),\n    T = (T0 || rows('Transactions')).filter(t => t.status !== 'VOID'), now = new Date().toISOString(),\n    out = [H['Student Balances']];\n  S.forEach(s => {\n    const e = C.filter(c => !c.section || c.section.toUpperCase() === 'ALL' || c.section === s.section).reduce((a, c) => a + Number(c.amount || 0) * times(c), 0);\n    const p = T.filter(t => t.studentId === s.id).reduce((a, t) => a + Number(t.amount), 0);\n    out.push([s.id, s.name, s.section, e, p, Math.max(e - p, 0), p > e ? 'OVERPAID' : (p === e && p > 0) ? 'PAID' : p > 0 ? 'PARTIAL' : 'UNPAID', now]);\n  });\n  const s = sh('Student Balances'); s.clear();\n  s.getRange(1, 1, out.length, 3).setNumberFormat('@');\n  s.getRange(1, 1, out.length, 8).setValues(out);\n}\n\nfunction times(c) {   // how many times a collection has come due\n  if (c.frequency !== 'weekly') return 1;\n  const st = new Date(c.start + 'T00:00:00'), now = new Date();\n  let end = now;\n  if (c.deadline) { const d = new Date(c.deadline + 'T00:00:00'); if (d < end) end = d; }\n  if (isNaN(st) || st > end) return 0;\n  return Math.floor((end - st) / 604800000) + 1;\n}\n\nfunction weeklyReminders() {   // runs from the Monday 8 AM trigger\n  CUR = 'system (weekly reminders)';\n  const L = LockService.getScriptLock(); L.waitLock(20000);\n  try { sendReminders_(); } finally { L.releaseLock(); }\n}\n\nfunction sendReminders_() {   // emails every student who still owes something and has an email saved\n  const S = rows('Students'), C = rows('Collections').filter(c => c.status !== 'CLOSED'), T = rows('Transactions').filter(t => t.status !== 'VOID'),\n    cfg = Object.fromEntries(rows('Settings').map(x => [x.key, x.value])),\n    m = n => 'PHP ' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),\n    pay = [cfg.gcash_no ? 'GCash ' + cfg.gcash_no + (cfg.gcash_name ? ' (' + cfg.gcash_name + ')' : '') : '', cfg.bank || ''].filter(Boolean).join(' / ');\n  let sent = 0, skipped = 0;\n  S.forEach(s => {\n    const lines = []; let total = 0;\n    C.filter(c => !c.section || c.section.toUpperCase() === 'ALL' || c.section === s.section).forEach(c => {\n      const exp = Number(c.amount || 0) * times(c), paid = T.filter(t => t.studentId === s.id && t.collId === c.id).reduce((a, t) => a + Number(t.amount), 0), rem = exp - paid;\n      if (rem > 0.004) { total += rem; lines.push('- ' + c.name + ': ' + m(rem) + (c.deadline ? ' (deadline ' + c.deadline + ')' : '')); }\n    });\n    if (!lines.length) return;\n    if (!s.email || !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(s.email) || MailApp.getRemainingDailyQuota() < 1) { skipped++; return; }\n    try {\n      MailApp.sendEmail({ to: s.email, subject: 'Class fund reminder', name: 'KOLEKTA',\n        body: 'Hi ' + s.name + ',\\n\\nPaalala lang po tungkol sa class fund. May natitira ka pang balance na ' + m(total) + ':\\n\\n' + lines.join('\\n') +\n          (pay ? '\\n\\nPwede magbayad via ' + pay + ' o cash sa treasurer.' : '\\n\\nPwede magbayad sa treasurer.') +\n          '\\n\\nKung nakapagbayad ka na, pakisabihan ang treasurer. Salamat!' + (PropertiesService.getScriptProperties().getProperty('APP_URL') ? ' Tingnan ang balance at magbayad dito: ' + PropertiesService.getScriptProperties().getProperty('APP_URL') + '?p=1' : '') });\n      sent++;\n    } catch (e) { skipped++; }\n  });\n  log('email reminders', sent + ' sent, ' + skipped + ' skipped');\n  return { sent: sent, skipped: skipped };\n}\n\n// ---------- one tab per collection (\"Coll - <name>\"): students on the left, payments on the right ----------\nfunction collTab_(c) {\n  const ss = db(), P = PropertiesService.getScriptProperties(), map = JSON.parse(P.getProperty('COLL_TABS') || '{}');\n  const base = 'Coll - ' + String(c.name || c.id).replace(/[\\[\\]*?\\/\\\\:]/g, '').slice(0, 60);\n  const taken = Object.keys(map).filter(k => k !== c.id).map(k => map[k]);\n  const name = taken.indexOf(base) >= 0 ? base + ' (' + String(c.id).slice(-4) + ')' : base;\n  let s = map[c.id] ? ss.getSheetByName(map[c.id]) : null;\n  if (!s) s = ss.getSheetByName(name) || ss.insertSheet(name);\n  else if (s.getName() !== name && !ss.getSheetByName(name)) s.setName(name);\n  map[c.id] = s.getName();\n  P.setProperty('COLL_TABS', JSON.stringify(map));\n  return s;\n}\nfunction buildColl_(c, S, T) {\n  const s = collTab_(c), a = Number(c.amount || 0), exp = a * times(c), mine = T.filter(t => t.collId === c.id);\n  const stud = S.filter(x => !c.section || c.section.toUpperCase() === 'ALL' || c.section === x.section);\n  const L = stud.map(x => {\n    const p = mine.filter(t => t.studentId === x.id && t.status !== 'VOID'), paid = p.reduce((k, t) => k + Number(t.amount), 0), last = p.map(t => t.date).sort().pop() || '';\n    return [x.id, x.name, x.section, exp, paid, Math.max(exp - paid, 0), paid > exp ? 'OVERPAID' : (paid === exp && paid > 0) ? 'PAID' : paid > 0 ? 'PARTIAL' : 'UNPAID', last];\n  });\n  const R = mine.slice().sort((x, y) => (x.date + x.time) < (y.date + y.time) ? -1 : 1)\n    .map(t => [t.date, t.time, t.studentId, t.name, Number(t.amount), t.method || 'Cash', t.ref || '', t.receipt || t.txid, t.status === 'VOID' ? 'VOID' : 'VALID', t.by]);\n  s.clear();\n  const title = c.name + '  |  ' + (c.frequency === 'weekly' ? 'weekly' : 'one-time') + ' PHP ' + a + (c.deadline ? '  |  deadline ' + c.deadline : '');\n  const stamp = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm');\n  s.getRange(1, 1).setValue(title + '  |  updated ' + stamp);\n  s.getRange(1, 1).setFontWeight('bold');\n  const h1 = s.getRange(3, 1, 1, 8);\n  h1.setValues([['Student ID', 'Name', 'Section', 'Expected', 'Paid', 'Balance', 'Status', 'Last payment']]);\n  h1.setFontWeight('bold');\n  h1.setBackground('#d9f5e3');\n  const h2 = s.getRange(3, 10, 1, 10);\n  h2.setValues([['Date', 'Time', 'Student ID', 'Name', 'Amount', 'Method', 'Reference', 'Receipt no.', 'Status', 'Recorded by']]);\n  h2.setFontWeight('bold');\n  h2.setBackground('#d9f5e3');\n  if (L.length) {\n    s.getRange(4, 1, L.length, 3).setNumberFormat('@'); s.getRange(4, 8, L.length, 1).setNumberFormat('@');\n    s.getRange(4, 1, L.length, 8).setValues(L);\n    const sum = i => L.reduce((k, r) => k + Number(r[i]), 0);\n    s.getRange(4 + L.length, 1, 1, 8).setValues([['', 'TOTAL', '', sum(3), sum(4), sum(5), '', '']]).setFontWeight('bold');\n  }\n  if (R.length) { s.getRange(4, 10, R.length, 3).setNumberFormat('@'); s.getRange(4, 10, R.length, 10).setValues(R); }\n  s.setFrozenRows(3);\n  s.autoResizeColumns(1, 19);\n}\nfunction collSync_(id) {   // never blocks or fails the payment itself\n  try {\n    const c = rows('Collections').find(x => x.id === String(id));\n    if (c) buildColl_(c, rows('Students'), rows('Transactions'));\n  } catch (e) { log('collection sheet failed', id + ' ' + e); }\n}\nfunction collSyncAll_() {\n  const S = rows('Students'), T = rows('Transactions'), C = rows('Collections');\n  C.forEach(c => { try { buildColl_(c, S, T); } catch (e) { log('collection sheet failed', c.id + ' ' + e); } });\n  return C.length;\n}\n\n// ---------- fast saving: the payment request only appends the row; heavy rebuilds and emails run in the background ----------\nfunction putMany(n, list) {   // several rows of one sheet in a single read\n  const s = sh(n), h = H[n], v = s.getDataRange().getValues(), add = [];\n  list.forEach(row => {\n    const a = h.map(k => row[k] == null ? '' : row[k]), i = v.findIndex((r, k) => k && String(r[0]) === String(row[h[0]]));\n    if (i > 0) { v[i] = a; s.getRange(i + 1, 1, 1, h.length).setValues([a]); } else add.push(a);\n  });\n  if (add.length) s.getRange(s.getLastRow() + 1, 1, add.length, h.length).setValues(add);\n}\nfunction hasClient_(n, id) {   // has this clientId been saved already? (a retry must never create a second payment)\n  if (!id) return false;\n  if (CacheService.getScriptCache().get('c_' + id)) return true;\n  const s = sh(n), last = s.getLastRow(), ci = H[n].indexOf('clientId') + 1;\n  if (last < 2) return false;\n  return s.getRange(2, ci, last - 1, 1).getValues().some(r => String(r[0]) === String(id));\n}\nfunction refDup_(ref) {   // txid of an earlier valid payment with the same reference number, or ''\n  const key = String(ref).toUpperCase().replace(/\\s+/g, '');\n  if (!key) return '';\n  const s = sh('Transactions'), last = s.getLastRow();\n  if (last < 2) return '';\n  const hd = H.Transactions, ids = s.getRange(2, 1, last - 1, 1).getValues(),\n    st = s.getRange(2, hd.indexOf('status') + 1, last - 1, 1).getValues(), rf = s.getRange(2, hd.indexOf('ref') + 1, last - 1, 1).getValues();\n  for (let i = 0; i < rf.length; i++) if (st[i][0] !== 'VOID' && String(rf[i][0]).toUpperCase().replace(/\\s+/g, '') === key) return String(ids[i][0]);\n  return '';\n}\nfunction prepProof_(q) {   // saves the photo to Drive BEFORE the lock, so a slow upload never holds up other payments\n  const t = q.row;\n  if (!t || !t.proofData) return;\n  const tx = q.action === 'tx', sn = tx ? 'Transactions' : 'Expenses', nm = tx ? 'pay-' + t.txid : 'exp-' +
